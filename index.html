<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name | Full Stack Developer Portfolio</title>
  <meta name="description" content="Portfolio of Your Name, a developer building fast, accessible web applications. Browse projects, skills and experience, then get in touch.">
  <meta name="theme-color" content="#0c0e12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS v4 browser build (zero-build prototype). Use this OR the Tailwind CLI, never both. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <header class="site-header sticky top-0 z-50">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5">
      <a href="#home" id="brand" class="font-heading text-lg font-semibold" aria-label="Back to top"></a>

      <nav aria-label="Primary" class="hidden items-center gap-1 md:flex">
        <a class="nav-link" href="#home">Home</a>
        <a class="nav-link" href="#about">About</a>
        <a class="nav-link" href="#skills">Skills</a>
        <a class="nav-link" href="#projects">Projects</a>
        <a class="nav-link" href="#experience">Experience</a>
        <a class="nav-link" href="#contact">Contact</a>
      </nav>

      <div class="flex items-center gap-2">
        <a href="#contact" class="btn btn-primary hidden sm:inline-flex">Let's Connect</a>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme"><i data-lucide="sun" class="icon-sun h-5 w-5"></i><i data-lucide="moon" class="icon-moon h-5 w-5"></i></button>
        <button id="menu-toggle" class="icon-btn md:hidden" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu"><i data-lucide="menu" class="h-5 w-5"></i></button>
      </div>
    </div>
    <nav id="mobile-menu" aria-label="Mobile" class="hidden border-t md:hidden" style="border-color:var(--border)">
      <div class="mx-auto flex max-w-6xl flex-col gap-1 px-5 py-3">
        <a class="nav-link" href="#home">Home</a>
        <a class="nav-link" href="#about">About</a>
        <a class="nav-link" href="#skills">Skills</a>
        <a class="nav-link" href="#projects">Projects</a>
        <a class="nav-link" href="#experience">Experience</a>
        <a class="nav-link" href="#contact">Contact</a>
        <a href="#contact" class="btn btn-primary mt-2 justify-center">Let's Connect</a>
      </div>
    </nav>
  </header>

  <main id="main">
    <section id="home" class="relative overflow-hidden" aria-labelledby="hero-title"></section>
    <section id="about" class="section" aria-labelledby="about-title"></section>
    <section id="skills" class="section" aria-labelledby="skills-title"></section>
    <section id="projects" class="section" aria-labelledby="projects-title"></section>
    <section id="experience" class="section" aria-labelledby="experience-title"></section>
    <section id="achievements" class="section" aria-labelledby="achievements-title"></section>
    <section id="contact" class="section" aria-labelledby="contact-title"></section>
  </main>

  <footer class="border-t" style="border-color:var(--border)" id="footer"></footer>

  <button id="to-top" class="icon-btn to-top" type="button" aria-label="Back to top"><i data-lucide="arrow-up" class="h-5 w-5"></i></button>

  <noscript><p class="p-6 text-center">This portfolio needs JavaScript enabled to display its content.</p></noscript>
  <script src="js/script.js"></script>
</body>
</html>
